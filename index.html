<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B1610">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viandas">
<title>Viandas Sin Vueltas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#2B1610; --fondo-2:#3A1F17; --card:#4A281D; --linea:#5E3527;
  --terra:#C4572E; --terra-claro:#F2D3C2; --crema:#FBF6EE; --mostaza:#E2A63B; --verde:#6FB383; --suave:#C9AFA2;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--crema);font-family:var(--sans);font-size:15px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;line-height:1.2}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
main{max-width:560px;margin:0 auto;padding:0 0 90px}
.top{padding:22px 18px 6px;display:flex;justify-content:space-between;align-items:center}
.top h1{font-size:1.35rem}
.top h1 em{color:var(--terra);font-style:italic;font-weight:500}
.saludo{padding:0 18px 14px;color:var(--suave);font-size:.9rem}

/* Hoy */
.hoy{margin:6px 18px 22px;background:linear-gradient(135deg,var(--terra),#8A3A22);border-radius:22px;padding:18px}
.hoy small{text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;font-weight:700;opacity:.85}
.hoy h2{font-size:1.25rem;margin:4px 0 10px}
.hoy p{margin:2px 0;font-size:.92rem}
.hoy .de{display:inline-block;margin-top:10px;background:rgba(0,0,0,.2);border-radius:999px;padding:4px 10px;font-size:.75rem;font-weight:600}

/* Filas tipo catálogo */
.fila{margin-bottom:22px}
.fila h3{font-size:1.05rem;padding:0 18px 10px}
.carril{display:flex;gap:12px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.carril::-webkit-scrollbar{display:none}
.tarjeta{flex:0 0 140px;scroll-snap-align:start;text-align:left}
.tarjeta .foto{height:150px;border-radius:16px;background:linear-gradient(160deg,var(--card),var(--fondo-2));display:flex;align-items:center;justify-content:center;font-size:3rem;border:1px solid var(--linea);position:relative}
.tarjeta .foto .fav{position:absolute;top:8px;right:10px;font-size:1rem}
.tarjeta b{display:block;font-size:.88rem;margin-top:8px;line-height:1.3}
.tarjeta span{font-size:.75rem;color:var(--suave)}
.guia{flex-basis:220px}
.guia .foto{font-size:1rem;font-family:var(--serif);padding:16px;text-align:center;background:linear-gradient(160deg,#8A3A22,var(--fondo-2))}

/* Receta */
.volver{padding:16px 18px;font-weight:600;color:var(--terra-claro)}
.receta-hero{height:200px;margin:0 18px;border-radius:22px;background:linear-gradient(160deg,var(--card),var(--fondo-2));display:flex;align-items:center;justify-content:center;font-size:5rem;border:1px solid var(--linea)}
.receta-cab{padding:18px}
.receta-cab h2{font-size:1.6rem;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--fondo-2);border:1px solid var(--linea);border-radius:999px;padding:5px 11px;font-size:.78rem}
.acciones{display:flex;gap:10px;padding:0 18px 8px}
.btn{flex:1;border-radius:999px;padding:12px;font-weight:700;text-align:center;background:var(--fondo-2);border:1px solid var(--linea)}
.btn.prim{background:var(--terra);border-color:var(--mostaza)}
.bloque{margin:14px 18px;background:var(--fondo-2);border-radius:18px;padding:16px}
.bloque h3{font-size:1.1rem;margin-bottom:10px}
.porciones{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.9rem}
.porciones button{width:34px;height:34px;border-radius:50%;background:var(--card);font-size:1.2rem;font-weight:700}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--linea);font-size:.92rem}
.ing li:last-child{border:0}
.ing small{color:var(--suave);white-space:nowrap}
.pasos{margin:0;padding-left:22px}
.pasos li{margin-bottom:10px}
.nutri{width:100%;border-collapse:collapse;font-size:.9rem}
.nutri td{padding:7px 0;border-bottom:1px solid var(--linea)}
.nutri td:last-child{text-align:right;font-weight:600}
.nota{font-size:.75rem;color:var(--suave);margin-top:8px}

/* Menú */
.titulo{padding:22px 18px 4px;font-size:1.4rem}
.dia{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.dia:last-child{border:0}
.dia b{font-family:var(--serif)}
.dia .tag{display:inline-block;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 8px;margin-top:4px}
.tag.heladera{background:#2F4C3A;color:var(--verde)}
.tag.freezer{background:#2D3D55;color:#9DBCE8}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--linea);font-size:.9rem}
.check li:last-child{border:0}
.check input{width:20px;height:20px;accent-color:var(--terra);flex:0 0 20px;margin-top:1px}
.check li.hecho span{text-decoration:line-through;color:var(--suave)}
.cat-compra{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mostaza);font-weight:700;margin:14px 0 2px}
.vacio{padding:30px 18px;text-align:center;color:var(--suave)}
.semanas{display:flex;gap:8px;overflow-x:auto;padding:18px 18px 0;scrollbar-width:none}
.semanas::-webkit-scrollbar{display:none}
.semanas button{flex:0 0 auto;border:1px solid var(--linea);background:var(--fondo-2);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;color:var(--suave)}
.semanas button.activa{background:var(--terra);border-color:var(--mostaza);color:var(--crema)}

/* Barra inferior */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(43,22,16,.96);backdrop-filter:blur(8px);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:560px}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--suave);text-decoration:none;font-size:.7rem;font-weight:600}
nav a i{display:block;font-style:normal;font-size:1.25rem;margin-bottom:2px}
nav a.activo{color:var(--crema)}
nav a.activo i{filter:none}

@media print{
  nav,.volver,.acciones,.porciones button{display:none}
  body{background:#fff;color:#000}
  .bloque,.receta-hero{background:#fff;border:1px solid #ccc}
}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
  <a href="#/" data-tab="inicio"><i>🏠</i>Inicio</a>
  <a href="#/menu" data-tab="menu"><i>📅</i>Menú</a>
  <a href="#/compras" data-tab="compras"><i>🛒</i>Compras</a>
  <a href="#/favoritos" data-tab="favoritos"><i>♥</i>Favoritas</a>
</div></nav>

<script src="recetas.js"></script>
<script src="recetas-2.js"></script>
<script>
// ---- Guardado local (puede fallar en modo privado: la app sigue andando igual) ----
function leer(k, def){ try { var v = localStorage.getItem("vsv-" + k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function guardar(k, v){ try { localStorage.setItem("vsv-" + k, JSON.stringify(v)); } catch(e){} }

var estado = {
  favoritos: leer("favoritos", []),
  semana: leer("semana", 0),
  compras: leer("compras", {}),          // "semana:ingrediente" -> comprado
  domingo: leer("domingo", {}),          // "semana:paso" -> hecho
  porciones: {}
};

var app = document.getElementById("app");
function menuActual(){ return MENUS[estado.semana] || MENUS[0]; }
function clave(x){ return menuActual().id + ":" + x; }
function elegirSemana(i){ estado.semana = i; guardar("semana", i); render(); }
function selectorSemanas(){
  return '<div class="semanas">' + MENUS.map(function(m, i){
    return '<button class="' + (i === estado.semana ? 'activa' : '') + '" onclick="elegirSemana(' + i + ')">Semana ' + (i + 1) + '</button>';
  }).join("") + '</div>';
}
function textoConserva(r){ return r.conserva || ("Heladera " + r.heladera + (r.heladera === 1 ? " día" : " días")); }
function receta(id){ return RECETAS.filter(function(r){ return r.id === id; })[0]; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function esFav(id){ return estado.favoritos.indexOf(id) > -1; }

// Nutrición por porción, calculada desde los gramos de cada ingrediente
function nutricion(r){
  var t = {kcal:0, p:0, c:0, gr:0};
  r.i.forEach(function(x){
    var n = NUTRI[x[0]]; var g = x[1] * (n.comestible || 1) / 100;
    t.kcal += n.kcal * g; t.p += n.p * g; t.c += n.c * g; t.gr += n.gr * g;
  });
  for (var k in t) t[k] = t[k] / r.porciones;
  return t;
}

function cantidad(x, factor){
  var n = NUTRI[x[0]];
  if (!x[1]) return "a gusto";
  var g = x[1] * factor;
  if (n.unidad) { var u = Math.round(g / n.unidad * 2) / 2; return u + (u === 1 ? " unidad" : " unidades"); }
  return g >= 1000 ? (Math.round(g / 100) / 10) + " kg" : Math.round(g) + " g";
}

function tarjeta(r){
  return '<button class="tarjeta" onclick="location.hash=\'#/receta/' + r.id + '\'">' +
    '<div class="foto">' + r.emoji + (esFav(r.id) ? '<span class="fav">♥</span>' : '') + '</div>' +
    '<b>' + esc(r.nombre) + '</b><span>' + r.min + ' min · ' + r.porciones + ' porc.</span></button>';
}

// ---- Pantallas ----
function inicio(){
  var menu = menuActual();
  var hoyIdx = new Date().getDay() - 1;        // lunes = 0
  var dia = menu.dias[hoyIdx];
  var h = '<div class="top"><h1>Viandas <em>Sin Vueltas</em></h1></div>';
  h += '<p class="saludo">Tu semana, resuelta.</p>';
  if (dia) {
    h += '<div class="hoy"><small>Hoy · ' + dia.dia + ' · ' + esc(menu.nombre.split(" · ")[0]) + '</small><h2>Qué comés hoy</h2>' +
      '<p>☀️ ' + esc(dia.alm) + '</p><p>🌙 ' + esc(dia.cena) + '</p>' +
      '<span class="de">' + (dia.de === "freezer" ? "Sale del freezer: pasalo a la heladera la noche anterior" : "Sale de la heladera") + '</span></div>';
  } else {
    h += '<div class="hoy"><small>Fin de semana</small><h2>El domingo se cocina</h2>' +
      '<p>2 horas y la semana queda lista.</p><span class="de" onclick="location.hash=\'#/menu\'">Ver el plan del domingo →</span></div>';
  }
  CATEGORIAS.forEach(function(c){
    if (c.id === "empeza") {
      h += '<div class="fila"><h3>' + c.nombre + '</h3><div class="carril">' +
        '<button class="tarjeta guia" onclick="location.hash=\'#/menu\'"><div class="foto">El domingo de 2 horas</div><b>Cómo funciona la app</b><span>Leelo primero · 2 min</span></button>' +
        '<button class="tarjeta guia" onclick="location.hash=\'#/freezer\'"><div class="foto">Guía de freezer</div><b>Qué se congela y cuánto dura</b><span>Heladera y freezer</span></button>' +
        '</div></div>';
      h += '<div class="fila"><h3>Menús semanales</h3><div class="carril">' + MENUS.map(function(m, i){
        var partes = m.nombre.split(" · ");
        return '<button class="tarjeta guia" onclick="elegirSemana(' + i + ');location.hash=\'#/menu\'"><div class="foto">' + esc(partes[1] || m.nombre) + '</div><b>' + esc(partes[0]) + '</b><span>' + m.recetas.length + ' recetas · lista de compras</span></button>';
      }).join("") + '</div></div>';
      return;
    }
    var lista = RECETAS.filter(function(r){ return r.cat === c.id; });
    if (!lista.length) return;
    h += '<div class="fila"><h3>' + c.nombre + '</h3><div class="carril">' + lista.map(tarjeta).join("") + '</div></div>';
  });
  return h;
}

function vistaReceta(id){
  var r = receta(id); if (!r) return '<p class="vacio">No encontramos esa receta.</p>';
  var porc = estado.porciones[id] || r.porciones, f = porc / r.porciones, n = nutricion(r);
  var h = '<button class="volver" onclick="history.back()">← Volver</button>';
  h += '<div class="receta-hero">' + r.emoji + '</div>';
  h += '<div class="receta-cab"><h2>' + esc(r.nombre) + '</h2><div class="chips">' +
    '<span class="chip">⏱ ' + r.min + ' min</span><span class="chip">🍽 ' + r.porciones + ' porciones</span>' +
    '<span class="chip">🧊 ' + esc(textoConserva(r)) + '</span>' +
    '<span class="chip">❄️ Freezer: ' + esc(r.freezer) + '</span></div></div>';
  h += '<div class="acciones"><button class="btn ' + (esFav(id) ? 'prim' : '') + '" onclick="alternarFav(\'' + id + '\')">' + (esFav(id) ? '♥ En favoritas' : '♡ Guardar') + '</button>' +
    '<button class="btn" onclick="window.print()">🖨 Imprimir</button></div>';
  h += '<div class="bloque"><h3>Ingredientes</h3><div class="porciones"><button onclick="cambiarPorc(\'' + id + '\',-1)">−</button><b>' + porc + ' porciones</b><button onclick="cambiarPorc(\'' + id + '\',1)">+</button></div><ul class="ing">' +
    r.i.map(function(x){ return '<li><span>' + esc(x[2]) + '</span>' + (f !== 1 ? '<small>' + cantidad(x, f) + '</small>' : '') + '</li>'; }).join("") + '</ul>' +
    (f !== 1 ? '<p class="nota">Cantidades ajustadas a ' + porc + ' porciones (a la derecha).</p>' : '') + '</div>';
  h += '<div class="bloque"><h3>Paso a paso</h3><ol class="pasos">' + r.pasos.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join("") + '</ol></div>';
  h += '<div class="bloque"><h3>Tabla nutricional por porción</h3><table class="nutri">' +
    '<tr><td>Calorías</td><td>' + Math.round(n.kcal) + ' kcal</td></tr><tr><td>Proteínas</td><td>' + Math.round(n.p) + ' g</td></tr>' +
    '<tr><td>Carbohidratos</td><td>' + Math.round(n.c) + ' g</td></tr><tr><td>Grasas</td><td>' + Math.round(n.gr) + ' g</td></tr></table>' +
    '<p class="nota">Valores orientativos calculados con tablas de composición de alimentos. No reemplazan la consulta con un profesional.</p></div>';
  return h;
}

function vistaMenu(){
  var m = menuActual();
  var h = selectorSemanas() + '<h2 class="titulo">' + esc(m.nombre) + '</h2>';
  h += '<div class="bloque"><h3>Qué comés cada día</h3>' + m.dias.map(function(d){
    return '<div class="dia"><div><b>' + d.dia + '</b><br><span class="tag ' + d.de + '">' + (d.de === "freezer" ? "del freezer" : "de la heladera") + '</span></div>' +
      '<div>☀️ ' + esc(d.alm) + '<br>🌙 ' + esc(d.cena) + '</div></div>';
  }).join("") + '<p class="nota">Desayunos: ' + esc(m.desayunos) + '</p></div>';
  h += '<div class="bloque"><h3>El domingo de 2 horas</h3><ul class="check">' + m.domingo.map(function(p, i){
    var hecho = estado.domingo[clave(i)];
    return '<li class="' + (hecho ? 'hecho' : '') + '"><input type="checkbox" ' + (hecho ? 'checked' : '') + ' onchange="marcarDomingo(' + i + ',this.checked)"><span>' + esc(p) + '</span></li>';
  }).join("") + '</ul></div>';
  h += '<div class="bloque"><h3>Recetas de esta semana</h3><div class="carril" style="padding:0">' + m.recetas.map(function(id){ return tarjeta(receta(id)); }).join("") + '</div></div>';
  h += '<div style="padding:0 18px"><a class="btn prim" style="display:block;text-decoration:none" href="#/compras">🛒 Ver la lista de compras</a></div>';
  return h;
}

// Suma los ingredientes de todas las recetas del menú y los agrupa por góndola
var GONDOLAS = ["Carnicería","Pescadería","Verdulería","Lácteos y huevos","Almacén"];

function listaCompras(){
  var total = {};
  menuActual().recetas.forEach(function(id){
    receta(id).i.forEach(function(x){ if (x[1] && NUTRI[x[0]].g !== "Hecho en casa") total[x[0]] = (total[x[0]] || 0) + x[1]; });
  });
  var grupos = {};
  Object.keys(total).forEach(function(k){
    var g = NUTRI[k].g; (grupos[g] = grupos[g] || []).push({id:k, nombre:NUTRI[k].n, cant:cantidad([k, total[k]], 1)});
  });
  return grupos;
}

function vistaCompras(){
  var grupos = listaCompras();
  var h = selectorSemanas() + '<h2 class="titulo">Lista de compras</h2><p class="saludo">Todo lo de la ' + esc(menuActual().nombre.toLowerCase()) + ', sumado y ordenado por góndola. Sal y especias no figuran.</p>';
  h += '<div class="bloque">';
  GONDOLAS.forEach(function(g){
    if (!grupos[g]) return;
    h += '<div class="cat-compra">' + g + '</div><ul class="check">' + grupos[g].map(function(x){
      var ok = estado.compras[clave(x.id)];
      return '<li class="' + (ok ? 'hecho' : '') + '"><input type="checkbox" ' + (ok ? 'checked' : '') + ' onchange="marcarCompra(\'' + x.id + '\',this.checked)"><span>' + esc(x.nombre) + ' · ' + x.cant + '</span></li>';
    }).join("") + '</ul>';
  });
  h += '</div><div class="acciones"><button class="btn prim" onclick="enviarWhatsApp()">Enviar por WhatsApp</button><button class="btn" onclick="limpiarCompras()">Desmarcar todo</button></div>';
  return h;
}

function vistaFavoritos(){
  var lista = RECETAS.filter(function(r){ return esFav(r.id); });
  var h = '<h2 class="titulo">Tus favoritas</h2>';
  if (!lista.length) return h + '<p class="vacio">Todavía no guardaste ninguna. Tocá ♡ Guardar en una receta.</p>';
  return h + '<div class="carril" style="flex-wrap:wrap;padding-top:14px">' + lista.map(tarjeta).join("") + '</div>';
}

function vistaFreezer(){
  var h = '<button class="volver" onclick="history.back()">← Volver</button><h2 class="titulo" style="padding-top:0">Guía de freezer</h2>';
  h += '<div class="bloque"><h3>Las 4 reglas</h3><ol class="pasos">' +
    '<li>Enfriá la comida y guardala en la heladera antes de que pasen 2 horas desde que la cocinaste.</li>' +
    '<li>Heladera a 4 °C o menos: lo cocido dura 3 a 4 días; arroz y legumbres, 2 días.</li>' +
    '<li>Freezer a −18 °C: guisos y salsas hasta 3 meses. Porcioná antes de congelar y anotá la fecha.</li>' +
    '<li>Descongelá en la heladera la noche anterior, nunca en la mesada.</li></ol></div>';
  h += '<div class="bloque"><h3>Cada receta</h3><ul class="ing">' + RECETAS.map(function(r){
    return '<li><span>' + r.emoji + ' ' + esc(r.nombre) + '</span><small>' + esc(r.conserva || r.heladera + ' d') + ' · ' + esc(r.freezer) + '</small></li>';
  }).join("") + '</ul><p class="nota">Plazos orientativos según guías de seguridad alimentaria (safefood, El Espectador, IPS). Ante cualquier duda de olor o aspecto, no lo comas.</p></div>';
  return h;
}

// ---- Acciones ----
function alternarFav(id){
  var i = estado.favoritos.indexOf(id);
  if (i > -1) estado.favoritos.splice(i, 1); else estado.favoritos.push(id);
  guardar("favoritos", estado.favoritos); render();
}
function cambiarPorc(id, d){
  var r = receta(id), p = (estado.porciones[id] || r.porciones) + d;
  estado.porciones[id] = Math.max(1, Math.min(12, p)); render();
}
function marcarCompra(id, v){ estado.compras[clave(id)] = v; guardar("compras", estado.compras); render(); }
function limpiarCompras(){
  Object.keys(estado.compras).forEach(function(k){ if (k.indexOf(menuActual().id + ":") === 0) delete estado.compras[k]; });
  guardar("compras", estado.compras); render();
}
function marcarDomingo(i, v){ estado.domingo[clave(i)] = v; guardar("domingo", estado.domingo); render(); }
function enviarWhatsApp(){
  var grupos = listaCompras(), txt = "🛒 Lista de compras · " + menuActual().nombre + "\n";
  GONDOLAS.forEach(function(g){
    if (!grupos[g]) return;
    var pend = grupos[g].filter(function(x){ return !estado.compras[clave(x.id)]; });
    if (!pend.length) return;
    txt += "\n*" + g + "*\n" + pend.map(function(x){ return "• " + x.nombre + " · " + x.cant; }).join("\n") + "\n";
  });
  window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
}

// ---- Ruteo ----
function render(){
  var r = location.hash.replace(/^#\/?/, "").split("/"), tab = "inicio", h;
  if (r[0] === "receta") { h = vistaReceta(r[1]); tab = ""; }
  else if (r[0] === "menu") { h = vistaMenu(); tab = "menu"; }
  else if (r[0] === "compras") { h = vistaCompras(); tab = "compras"; }
  else if (r[0] === "favoritos") { h = vistaFavoritos(); tab = "favoritos"; }
  else if (r[0] === "freezer") { h = vistaFreezer(); tab = ""; }
  else h = inicio();
  app.innerHTML = h;
  document.querySelectorAll("nav a").forEach(function(a){ a.classList.toggle("activo", a.dataset.tab === tab); });
}
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0, 0); });
render();
</script>
</body>
</html>
